<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f1f5fb;
        }

        .reset-card {
            width: 100%;
            max-width: 440px;
            padding: 35px;
            background: white;
            border: 1px solid #e3eaf5;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(20, 60, 120, 0.12);
        }

        h2 {
            text-align: center;
            color: #172b4d;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #718096;
            font-size: 14px;
            margin-bottom: 25px;
        }

        label {
            font-size: 14px;
            font-weight: 600;
            color: #344563;
            margin-bottom: 7px;
        }

        .form-control {
            padding: 12px;
            border-radius: 8px;
        }

        .btn-primary {
            width: 100%;
            padding: 12px;
            background: #1769e0;
            border: none;
            border-radius: 8px;
            font-weight: 600;
        }

        .btn-primary:hover {
            background: #0d50b5;
        }

        #message {
            font-size: 14px;
            overflow-wrap: anywhere;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 22px;
            text-decoration: none;
            color: #1769e0;
        }

        .step {
            display: none;
        }

        .step.active {
            display: block;
        }
    </style>
</head>

<body>
<div class="reset-card">

    <h2>Forgot Password?</h2>

    <p class="subtitle">
        Verify your email to reset your password.
    </p>

    <div id="message" class="mb-3" role="status" aria-live="polite"></div>

    <form id="csrf-form" style="display:none;">
        {% csrf_token %}
    </form>

    <!-- Step 1: Request OTP -->
    <section id="step-email" class="step active">
        <form id="email-form">
            <label for="email">Registered Email</label>
            <input class="form-control mb-3"
                   type="email"
                   id="email"
                   required
                   autocomplete="email"
                   placeholder="Enter your registered email">

            <button class="btn btn-primary" type="submit">
                Send OTP
            </button>
        </form>
    </section>

    <!-- Step 2: Verify OTP -->
    <section id="step-otp" class="step">
        <form id="otp-form">
            <label for="code">6-digit OTP</label>
            <input class="form-control mb-3"
                   type="text"
                   id="code"
                   required
                   inputmode="numeric"
                   pattern="[0-9]{6}"
                   maxlength="6"
                   placeholder="Enter OTP from email">

            <button class="btn btn-primary" type="submit">
                Verify OTP
            </button>
        </form>
    </section>

    <!-- Step 3: Set new password -->
    <section id="step-password" class="step">
        <form id="password-form">
            <label for="password">New Password</label>
            <input class="form-control mb-3"
                   type="password"
                   id="password"
                   required
                   autocomplete="new-password"
                   placeholder="Enter new password">

            <label for="confirm-password">Confirm Password</label>
            <input class="form-control mb-3"
                   type="password"
                   id="confirm-password"
                   required
                   autocomplete="new-password"
                   placeholder="Re-enter new password">

            <button class="btn btn-primary" type="submit">
                Reset Password
            </button>
        </form>
    </section>

    <a class="back-link" href="{% url 'login' %}">
        Back to Login
    </a>

</div>

<script>
    const messageBox = document.getElementById("message");
    const emailInput = document.getElementById("email");

    function showMessage(message, success = false) {
        messageBox.className = success
            ? "alert alert-success"
            : "alert alert-danger";

        messageBox.textContent = message;
    }

    function showStep(stepName) {
        document.querySelectorAll(".step").forEach(step => {
            step.classList.remove("active");
        });

        document.getElementById("step-" + stepName)
            .classList.add("active");

        messageBox.textContent = "";
        messageBox.className = "mb-3";
    }

    async function apiRequest(url, data) {
        const csrfToken = document.querySelector(
            "#csrf-form [name=csrfmiddlewaretoken]"
        ).value;

        const response = await fetch(url, {
            method: "POST",
            credentials: "same-origin",
            headers: {
                "Content-Type": "application/json",
                "X-CSRFToken": csrfToken
            },
            body: JSON.stringify(data)
        });

        const result = await response.json().catch(() => ({}));

        if (!response.ok) {
            const detail = result.detail ||
                Object.values(result).flat().join(" ") ||
                "Request failed. Please try again.";

            throw new Error(detail);
        }

        return result;
    }

    document.getElementById("email-form")
        .addEventListener("submit", async function(event) {
            event.preventDefault();

            try {
                const result = await apiRequest(
                    "/api/auth/forgot-password/",
                    { email: emailInput.value.trim() }
                );

                showStep("otp");
                showMessage(
                    result.detail ||
                    "If an account exists for this email, a verification code will be sent.",
                    true
                );
            } catch (error) {
                showMessage(error.message);
            }
        });

    document.getElementById("otp-form")
        .addEventListener("submit", async function(event) {
            event.preventDefault();

            try {
                const result = await apiRequest(
                    "/api/auth/verify-otp/",
                    {
                        email: emailInput.value.trim(),
                        code: document.getElementById("code").value.trim()
                    }
                );

                showStep("password");
                showMessage(
                    result.detail || "OTP verified. Set your new password.",
                    true
                );
            } catch (error) {
                showMessage(error.message);
            }
        });

    document.getElementById("password-form")
        .addEventListener("submit", async function(event) {
            event.preventDefault();

            const password = document.getElementById("password").value;
            const confirmPassword =
                document.getElementById("confirm-password").value;

            if (password !== confirmPassword) {
                showMessage("Passwords do not match.");
                return;
            }

            try {
                const result = await apiRequest(
                    "/api/auth/reset-password/",
                    {
                        password: password,
                        confirm_password: confirmPassword
                    }
                );

                showMessage(
                    result.detail || "Password reset successfully.",
                    true
                );

                document.getElementById("password-form").reset();

                setTimeout(() => {
                    window.location.href = "{% url 'login' %}";
                }, 1800);
            } catch (error) {
                showMessage(error.message);
            }
        });
</script>

</body>
</html>
