<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Student Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f1f5fb;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
        }

        .register-card {
            width: 100%;
            max-width: 480px;
            background: white;
            padding: 35px 38px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(20, 60, 120, 0.12);
            border: 1px solid #e3eaf5;
        }

        .register-icon {
            width: 58px;
            height: 58px;
            margin: 0 auto 16px;
            border-radius: 14px;
            background: #e8f1ff;
            color: #1769e0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 27px;
            font-weight: bold;
        }

        h2 {
            text-align: center;
            color: #172b4d;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #718096;
            font-size: 14px;
            margin-bottom: 28px;
        }

        form p {
            margin-bottom: 20px;
        }

        form label {
            display: block;
            color: #344563;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        form input {
            display: block;
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d5deeb;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            background: #fff;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        form input:focus {
            border-color: #1769e0;
            box-shadow: 0 0 0 3px rgba(23, 105, 224, 0.12);
        }

        .helptext {
            display: block;
            margin-top: 8px;
            color: #778398;
            font-size: 12px;
            line-height: 1.6;
        }

        form ul {
            padding-left: 20px;
            margin-top: 8px;
            color: #778398;
            font-size: 12px;
            line-height: 1.7;
        }

        .errorlist {
            color: #dc3545;
            font-size: 13px;
            padding-left: 18px;
            margin: 5px 0 10px;
        }

        .register-btn {
            width: 100%;
            padding: 13px;
            background: #1769e0;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            margin-top: 5px;
            transition: background 0.2s;
        }

        .register-btn:hover {
            background: #0d50b5;
        }

        .login-link {
            text-align: center;
            color: #718096;
            font-size: 14px;
            margin-top: 24px;
            margin-bottom: 0;
        }

        .login-link a {
            color: #1769e0;
            text-decoration: none;
            font-weight: 600;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .register-card {
                padding: 28px 22px;
            }

            h2 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>
    <div class="register-card">

        <div class="register-icon">+</div>

        <h2>Create Account</h2>
        <p class="subtitle">Register to access the Student Management System</p>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-info" role="alert">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="register-btn">
                Create Account
            </button>
        </form>

        <p class="login-link">
            Already have an account?
            <a href="{% url 'login' %}">Login here</a>
        </p>

    </div>
</body>
</html>
