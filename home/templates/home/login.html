
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #eaf2ff, #f8fbff);
            min-height: 100vh;
        }

        .login-card {
            border: none;
            border-radius: 18px;
            overflow: hidden;
        }

        .login-title {
            color: #174ea6;
            font-weight: 700;
        }

        .role-btn {
            border: 1px solid #0d6efd;
            color: #0d6efd;
            background: white;
            padding: 10px;
            font-weight: 600;
        }

        .role-btn.active {
            background: #0d6efd;
            color: white;
        }

        .form-control {
            padding: 11px;
        }

        .login-submit {
            padding: 11px;
            font-weight: 600;
        }
    </style>
</head>

<body>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">

            <div class="card login-card shadow-lg">
                <div class="card-body p-4 p-md-5">

                    <h2 class="text-center login-title mb-2">
                        Welcome Back
                    </h2>

                    <p class="text-center text-muted mb-4">
                        Select your login type
                    </p>

                    {% if messages %}
                        {% for message in messages %}
                            <div class="alert alert-danger">
                                {{ message }}
                            </div>
                        {% endfor %}
                    {% endif %}

                    <div class="d-flex gap-2 mb-4">
                        <button type="button"
                                id="userTab"
                                class="btn role-btn active w-50"
                                onclick="selectRole('user')">
                            User Login
                        </button>

                        <button type="button"
                                id="adminTab"
                                class="btn role-btn w-50"
                                onclick="selectRole('admin')">
                            Admin Login
                        </button>
                    </div>

                    <form method="POST">
                        {% csrf_token %}

                        <input type="hidden"
                               name="role"
                               id="selectedRole"
                               value="user">

                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <input type="text"
                                   name="username"
                                   class="form-control"
                                   placeholder="Enter username"
                                   required>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Password</label>
                            <input type="password"
                                   name="password"
                                   class="form-control"
                                   placeholder="Enter password"
                                   required>
                        </div>

                        <button type="submit"
                                class="btn btn-primary w-100 login-submit">
                            Login as User
                        </button>
                    </form>

                    <div class="text-center mt-4">
                        <p class="mb-2">
                            Don't have an account?
                            <a href="{% url 'register' %}">Register here</a>
                        </p>

                        <p class="mb-0">
                            <a href="{% url 'forgot_password_page' %}">
                                Forgot Password?
                            </a>
                        </p>
                    </div>

                </div>
            </div>

        </div>
    </div>
</div>

<script>
    function selectRole(role) {
        document.getElementById("selectedRole").value = role;

        const userTab = document.getElementById("userTab");
        const adminTab = document.getElementById("adminTab");
        const submitButton = document.querySelector(".login-submit");

        userTab.classList.toggle("active", role === "user");
        adminTab.classList.toggle("active", role === "admin");

        submitButton.textContent =
            role === "admin" ? "Login as Admin" : "Login as User";
    }
</script>

</body>
</html>
